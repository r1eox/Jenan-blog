<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="50%" style="stop-color:#f0d060"/>
      <stop offset="100%" style="stop-color:#a07c1e"/>
    </linearGradient>
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  <!-- حرف J الكبير -->
  <text x="10" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="bold" fill="#111111" filter="url(#textShadow)">J</text>
  <!-- enan -->
  <text x="145" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="400" fill="#111111">enan</text>
  <!-- PRO -->
  <text x="148" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-style="italic" font-weight="700" fill="url(#goldGrad)">PRO</text>
</svg>
